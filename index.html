<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document Organizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>try{var t=localStorage.getItem('theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
  <svg class="icon-moon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <svg class="icon-sun" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
</button>

<main class="wrap">
  <header class="hero">
    <h1>Document Organizer</h1>
    <p>Drop in your files, find them fast, and preview them without leaving the page.</p>
    <div class="stats" id="stats"></div>
  </header>

  <section class="layout">
    <div class="left">
      <label id="dropzone" class="dropzone" tabindex="0">
        <input type="file" id="fileInput" multiple hidden>
        <span class="dz-icon">⬆</span>
        <strong>Drop files here</strong>
        <span>or click to browse</span>
      </label>

      <div class="panel">
        <input type="search" id="searchInput" placeholder="Search by name…" aria-label="Search documents">
        <div class="row">
          <select id="categoryFilter" aria-label="Filter by category">
            <option value="all">All categories</option>
            <option value="text">Text</option>
            <option value="pdf">PDF</option>
            <option value="image">Images</option>
            <option value="office">Office</option>
            <option value="other">Other</option>
          </select>
          <select id="sortSelect" aria-label="Sort documents">
            <option value="all">Sort: All (as added)</option>
            <option value="size">Sort: Size</option>
            <option value="time">Sort: Upload time</option>
            <option value="date">Sort: Modified date</option>
            <option value="name">Sort: Name</option>
          </select>
          <button id="dirBtn" class="icon-btn" title="Toggle ascending / descending" aria-label="Toggle sort direction">↓</button>
        </div>
      </div>

      <div id="documentsList" class="list"></div>
    </div>

    <aside class="preview" id="previewCard">
      <div class="preview-head" id="previewHead"></div>
      <div id="contentPreview" class="preview-body"></div>
    </aside>
  </section>
</main>
<div id="toast" class="toast" role="status"></div>
<script src="script.js"></script>
</body>
</html>
